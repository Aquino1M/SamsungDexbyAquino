name: Bug report
description: Relate um problema no Android Dex by Aquino
title: "[BUG] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Obrigado por testar o Android Dex by Aquino. Não publique senhas, códigos de pareamento ou dados pessoais."
  - type: input
    id: version
    attributes:
      label: Versão/build
      placeholder: Ex. 0.2.0-enhanced
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Aparelho e Android
      placeholder: Ex. Galaxy S23 / Android 16
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnóstico
      description: Cole o conteúdo relevante ou anexe o JSON criado por scripts/Diagnostics.ps1.
