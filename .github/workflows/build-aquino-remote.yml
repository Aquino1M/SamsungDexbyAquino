name: Build Aquino Remote APK
on:
  push:
    paths:
      - 'android/AquinoRemote/**'
      - '.github/workflows/build-aquino-remote.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android/AquinoRemote
        run: gradle :app:assembleDebug
      - name: Rename APK
        run: cp android/AquinoRemote/app/build/outputs/apk/debug/app-debug.apk AquinoRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AquinoRemote-apk
          path: AquinoRemote.apk
